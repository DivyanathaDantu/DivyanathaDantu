</g></g><circle cx="52" cy="54" r="4" fill="#77e5bb"/><text x="67" y="59" font-size="12" fill="#a4b8b8" class="mono" letter-spacing="1.2">CANADA / FULL STACK DEVELOPER</text><text x="46" y="155" font-size="76" fill="#edf5f2" font-weight="750" letter-spacing="-2.5" class="name">Divy Dantu</text><text x="48" y="197" font-size="23" fill="#a4b8b8" class="intro">Building useful things for the web.</text><path d="M48 267H912" stroke="#29414b"/><text x="48" y="304" font-size="15" fill="#77e5bb" class="mono">&lt;/&gt;</text><defs><clipPath id="typing"><rect class="typing" x="0" y="0" width="270" height="40"/></clipPath></defs><g transform="translate(87 284)" clip-path="url(#typing)"><text x="0" y="20" font-size="14" fill="#edf5f2" class="mono">Code. Ship. Hit the court.</text></g><path class="cursor" d="M87 288v18" stroke="#77e5bb" stroke-width="2"/>
