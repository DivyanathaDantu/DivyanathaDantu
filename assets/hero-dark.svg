<path d="M22 180H288" stroke-dasharray="2 4"/>
</g></g><path d="M610 264Q676 44 903 166" fill="none" stroke="#77e5bb" stroke-width="2" stroke-dasharray="3 8" opacity=".55" class="arc"/><g transform="translate(903 166)"><g class="shuttle" fill="#edf5f2" stroke="#0c1722" stroke-width="1">
<path d="M-6 0L-24-19L-12-26L0-29L10-26L6 0Z"/>
<path d="M-3-1L-12-25M1-1L0-28M4-1L9-25" stroke="#77e5bb"/>
