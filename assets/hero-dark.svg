<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Divy Dantu — Full stack developer in Canada</title>
<desc id="desc">Building useful things for the web. A shuttlecock arcs across a badminton court. Code. Ship. Hit the court.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.name{animation:appear .8s ease-out both}.intro{animation:appear .8s .15s ease-out both}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.shuttle{animation:shuttle 7s ease-in-out infinite}@keyframes shuttle{0%,100%{transform:translate(-293px,98px) rotate(-48deg);opacity:0}8%{opacity:1}32%{transform:translate(-228px,-46px) rotate(-20deg)}60%{transform:translate(-126px,-49px) rotate(35deg)}85%{transform:translate(0,0) rotate(70deg);opacity:1}94%{opacity:0}}
.arc{animation:flow 2s linear infinite}@keyframes flow{to{stroke-dashoffset:-22}}
.typing{animation:type 9s steps(25,end) infinite}@keyframes type{0%,8%{width:0}45%,88%,100%{width:270px}}
.cursor{animation:caret 9s steps(25,end) infinite,blink 1s step-end infinite}@keyframes caret{0%,8%{transform:translateX(0)}45%,88%,100%{transform:translateX(211px)}}@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.cursor{display:none}}
</style>
<rect width="960" height="360" rx="20" fill="#0c1722"/><g transform="translate(615 -4) rotate(18 155 180)"><g fill="none" stroke="#77e5bb" stroke-width="1.5" opacity=".35">
