<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170" role="img" aria-labelledby="title desc">
<title id="title">Badminton Bookings workflow</title>
<desc id="desc">Book a court, invite players, play together, and split costs.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.flow{animation:flow 1.8s linear infinite}@keyframes flow{to{stroke-dashoffset:-32}}.step{animation:step 8s ease-in-out infinite}.s1{animation-delay:2s}.s2{animation-delay:4s}.s3{animation-delay:6s}@keyframes step{0%,24%{stroke-width:3}25%,100%{stroke-width:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.cursor{display:none}}
</style>
<rect width="960" height="170" rx="16" fill="#0c1722"/><path d="M123 57H837" fill="none" stroke="#29414b" stroke-width="2"/><path class="flow" d="M123 57H837" fill="none" stroke="#77e5bb" stroke-width="2" stroke-dasharray="4 12"/><circle class="step s0" cx="123" cy="57" r="20" fill="#132f32" stroke="#77e5bb"/><text x="123" y="62" font-size="12" fill="#77e5bb" text-anchor="middle" class="mono">01</text><text x="123" y="106" font-size="18" fill="#edf5f2" font-weight="600" text-anchor="middle">Book a court</text><text x="123" y="130" font-size="13" fill="#a4b8b8" text-anchor="middle">Find a time to play</text><circle class="step s1" cx="361" cy="57" r="20" fill="#132f32" stroke="#77e5bb"/><text x="361" y="62" font-size="12" fill="#77e5bb" text-anchor="middle" class="mono">02</text><text x="361" y="106" font-size="18" fill="#edf5f2" font-weight="600" text-anchor="middle">Invite players</text><text x="361" y="130" font-size="13" fill="#a4b8b8" text-anchor="middle">Bring everyone together</text><circle class="step s2" cx="599" cy="57" r="20" fill="#132f32" stroke="#77e5bb"/><text x="599" y="62" font-size="12" fill="#77e5bb" text-anchor="middle" class="mono">03</text><text x="599" y="106" font-size="18" fill="#edf5f2" font-weight="600" text-anchor="middle">Play together</text><text x="599" y="130" font-size="13" fill="#a4b8b8" text-anchor="middle">Get on the court</text><circle class="step s3" cx="837" cy="57" r="20" fill="#132f32" stroke="#77e5bb"/><text x="837" y="62" font-size="12" fill="#77e5bb" text-anchor="middle" class="mono">04</text><text x="837" y="106" font-size="18" fill="#edf5f2" font-weight="600" text-anchor="middle">Split costs</text><text x="837" y="130" font-size="13" fill="#a4b8b8" text-anchor="middle">Keep balances clear</text>
</svg>
