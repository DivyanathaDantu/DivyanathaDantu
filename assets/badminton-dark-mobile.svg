<svg xmlns="http://www.w3.org/2000/svg" width="440" height="362" viewBox="0 0 440 362" role="img" aria-labelledby="title desc">
<title id="title">Badminton Bookings workflow</title>
<desc id="desc">Book a court, invite players, play together, and split costs.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.flow{animation:flow 1.8s linear infinite}@keyframes flow{to{stroke-dashoffset:-32}}.step{animation:step 8s ease-in-out infinite}.s1{animation-delay:2s}.s2{animation-delay:4s}.s3{animation-delay:6s}@keyframes step{0%,24%{stroke-width:3}25%,100%{stroke-width:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.cursor{display:none}}
</style>
<rect width="440" height="362" rx="16" fill="#0c1722"/><path d="M42 48V300" fill="none" stroke="#29414b" stroke-width="2"/><path class="flow" d="M42 48V300" fill="none" stroke="#77e5bb" stroke-width="2" stroke-dasharray="4 12"/><circle class="step s0" cx="42" cy="48" r="20" fill="#132f32" stroke="#77e5bb"/><text x="42" y="53" font-size="12" fill="#77e5bb" text-anchor="middle" class="mono">01</text><text x="82" y="47" font-size="18" fill="#edf5f2" font-weight="600" >Book a court</text><text x="82" y="71" font-size="13" fill="#a4b8b8" >Find a time to play</text><circle class="step s1" cx="42" cy="132" r="20" fill="#132f32" stroke="#77e5bb"/><text x="42" y="137" font-size="12" fill="#77e5bb" text-anchor="middle" class="mono">02</text><text x="82" y="131" font-size="18" fill="#edf5f2" font-weight="600" >Invite players</text><text x="82" y="155" font-size="13" fill="#a4b8b8" >Bring everyone together</text><circle class="step s2" cx="42" cy="216" r="20" fill="#132f32" stroke="#77e5bb"/><text x="42" y="221" font-size="12" fill="#77e5bb" text-anchor="middle" class="mono">03</text><text x="82" y="215" font-size="18" fill="#edf5f2" font-weight="600" >Play together</text><text x="82" y="239" font-size="13" fill="#a4b8b8" >Get on the court</text><circle class="step s3" cx="42" cy="300" r="20" fill="#132f32" stroke="#77e5bb"/><text x="42" y="305" font-size="12" fill="#77e5bb" text-anchor="middle" class="mono">04</text><text x="82" y="299" font-size="18" fill="#edf5f2" font-weight="600" >Split costs</text><text x="82" y="323" font-size="13" fill="#a4b8b8" >Keep balances clear</text>
</svg>
